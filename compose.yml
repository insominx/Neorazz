services:
  neorazz:
    # Neorazz publishes no image yet, so this builds the checkout.
    build: .
    image: neorazz:local
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
